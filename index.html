<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Senin için bir not</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #1f1a2e;
    --paper: #f9e9ee;
    --ink: #3b1f2b;
    --ribbon: #c8324b;
    --ribbon-dark: #9e2238;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--night);
    color: var(--ink);
    font-family: "Caveat", cursive;
    display: flex;
    justify-content: center;
    padding: 32px 18px 56px;
  }
  main { width: 100%; max-width: 480px; }

  /* Kapalı hediye */
  .gift {
    display: block;
    width: 100%;
    border: 0;
    padding: 0;
    background: none;
    cursor: pointer;
    text-align: center;
    color: #fff;
  }
  .box {
    position: relative;
    height: 260px;
    border-radius: 6px;
    background: var(--ribbon);
    overflow: hidden;
    box-shadow: 0 18px 40px rgba(0,0,0,.45);
  }
  .box::before, .box::after { content: ""; position: absolute; background: var(--ribbon-dark); }
  .box::before { left: 50%; top: 0; bottom: 0; width: 44px; transform: translateX(-50%); }
  .box::after  { top: 50%; left: 0; right: 0; height: 44px; transform: translateY(-50%); }
  .tag {
    position: absolute; z-index: 2; left: 50%; top: 50%;
    transform: translate(-50%, -50%) rotate(-4deg);
    background: var(--paper); color: var(--ink);
    padding: 12px 22px; border-radius: 4px;
    font-size: 2rem; font-weight: 700;
    box-shadow: 0 6px 14px rgba(0,0,0,.35);
  }
  .hint { margin-top: 18px; font-size: 1.6rem; color: #e9d9df; }
  .gift:focus-visible { outline: 3px solid #fff; outline-offset: 6px; }

  /* Açılan not */
  .note {
    display: none;
    background: var(--paper);
    border-radius: 6px;
    padding: 34px 28px 30px;
    box-shadow: 0 18px 40px rgba(0,0,0,.45);
    transform-origin: top center;
  }
  .opened .gift { display: none; }
  .opened .note { display: block; animation: unfold .7s ease-out both; }
  @keyframes unfold {
    from { transform: perspective(900px) rotateX(-70deg); opacity: 0; }
    to   { transform: perspective(900px) rotateX(0); opacity: 1; }
  }
  h1 {
    font-family: "Fraunces", serif;
    font-size: 1.9rem; line-height: 1.2;
    margin: 0 0 18px;
  }
  .note p { font-size: 1.7rem; line-height: 1.35; margin: 0 0 14px; }
  .label { font-weight: 700; color: var(--ribbon-dark); }
  .gift-name {
    font-family: "Fraunces", serif; font-size: 1.5rem;
    border-left: 4px solid var(--ribbon);
    padding: 4px 0 4px 14px; margin: 18px 0;
  }
  .note img { width: 100%; border-radius: 4px; margin: 6px 0 16px; display: block; }
  .sign { text-align: right; font-size: 2rem; font-weight: 700; margin-top: 22px; }

  @media (prefers-reduced-motion: reduce) { .opened .note { animation: none; } }
</style>
</head>
<body>
<main id="app">

  <button class="gift" id="open" aria-label="Hediyeyi aç">
    <div class="box"><div class="tag">Sana özel</div></div>
    <div class="hint">Açmak için dokun</div>
  </button>

  <article class="note">
    <!-- 1) İSMİ DEĞİŞTİR -->
    <h1>Sevgili [İSİM],</h1>

    <p>Bu hediyeyi seçerken aklımdan tek bir şey geçti: seni gülümsetmek.</p>

    <!-- 2) HEDİYENİN ADINI YAZ -->
    <div class="gift-name"><span class="label">Hediyen:</span> [HEDİYENİN ADI]</div>

    <!-- 3) NEDEN SEÇTİĞİNİ YAZ -->
    <p><span class="label">Neden bunu seçtim?</span> [Kısa ve içten bir sebep yaz.]</p>

    <!-- 4) İSTERSEN FOTOĞRAF EKLE: dosyayı index.html ile aynı klasöre koy, adı foto.jpg olsun.
         Kullanmayacaksan aşağıdaki satırı tamamen sil. -->
    <img src="foto.jpg" alt="Birlikte çektiğimiz fotoğraf" onerror="this.remove()">

    <!-- 5) KÜÇÜK NOT -->
    <p>[Bir anı, bir espri ya da bir dilek.]</p>

    <p>İyi ki varsın.</p>

    <!-- 6) KENDİ ADINI YAZ -->
    <div class="sign">[SENİN ADIN]</div>
  </article>

</main>
<script>
  document.getElementById("open").addEventListener("click", function () {
    document.getElementById("app").classList.add("opened");
    window.scrollTo(0, 0);
  });
</script>
</body>
</html>
